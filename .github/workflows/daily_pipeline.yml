name: Daily Inference Pipeline

on:
  schedule:
    # Runs Mon–Fri at 12:00 UTC (5:30 PM IST) — after NSE close
    - cron: "0 12 * * 1-5"
  workflow_dispatch:   # Allows manual trigger from GitHub Actions UI

permissions:
  contents: write      # Needed to commit prediction artifacts back to the repo

jobs:
  daily-inference:
    runs-on: ubuntu-latest

    steps:
      # ── 1. Checkout ──────────────────────────────────────────────────────
      - name: Checkout repository
        uses: actions/checkout@v4

      # ── 2. Python setup ──────────────────────────────────────────────────
      - name: Set up Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      # ── 3. Cache pip dependencies ────────────────────────────────────────
      - name: Cache pip
        uses: actions/cache@v4
        with:
          path: ~/.cache/pip
          key: ${{ runner.os }}-pip-${{ hashFiles('requirements.txt') }}
          restore-keys: |
            ${{ runner.os }}-pip-

      # ── 4. Cache Hugging Face FinBERT model (saves ~1.5 min per run) ─────
      - name: Cache Hugging Face model
        uses: actions/cache@v4
        with:
          path: ~/.cache/huggingface
          key: ${{ runner.os }}-hf-finbert-v1
          restore-keys: |
            ${{ runner.os }}-hf-finbert-

      # ── 5. Install dependencies ──────────────────────────────────────────
      - name: Install dependencies
        run: |
          pip install --upgrade pip
          pip install -r requirements.txt

      # ── 6. Run inference ─────────────────────────────────────────────────
      - name: Run daily inference
        env:
          HF_HUB_DISABLE_SYMLINKS_WARNING: "1"
        run: python scripts/daily_inference.py

      # ── 7. Commit & push prediction artifact ─────────────────────────────
      - name: Commit prediction artifact
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add predictions/
          git diff --cached --quiet || git commit -m "chore: daily inference $(date -u +'%Y-%m-%d')"
          git push
